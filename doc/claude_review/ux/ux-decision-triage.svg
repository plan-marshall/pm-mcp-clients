<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Decisions as a triage list</title>
  <desc id="d">Left: open decisions as compact rows, blocking ones first, each with plan path, age and recommended option. Right: the selected decision with the recommendation by name, evidence as fields, options with votes and dissent, and the acts.</desc>
  <rect width="1200" height="720" fill="#0E1116"/>
  <text x="32" y="44" fill="#E6EAF2" font-size="22" font-weight="600">Decisions</text>
  <text x="152" y="44" fill="#8B95A7" font-size="14">8 open</text>
  <g font-size="12">
    <rect x="32" y="62" width="88" height="26" rx="13" fill="#1E2433" stroke="#3A4356"/><text x="76" y="79" fill="#E6EAF2" text-anchor="middle">Blocking 5</text>
    <rect x="128" y="62" width="92" height="26" rx="13" fill="none" stroke="#2A3140"/><text x="174" y="79" fill="#AEB6C4" text-anchor="middle">By project</text>
    <rect x="228" y="62" width="200" height="26" rx="8" fill="#161B22" stroke="#2A3140"/><text x="240" y="79" fill="#6B7587">Filter…</text>
  </g>
  <!-- list -->
  <rect x="32" y="104" width="448" height="590" rx="10" fill="#12161D" stroke="#2A3140"/>
  <g font-size="13">
    <rect x="40" y="112" width="432" height="72" rx="8" fill="#1E2433"/>
    <rect x="40" y="112" width="3" height="72" rx="1.5" fill="#7C6CF6"/>
    <text x="56" y="136" fill="#E6EAF2" font-weight="600">Resolve rebase conflict</text>
    <text x="460" y="136" fill="#8B95A7" font-size="12" text-anchor="end">2 h</text>
    <text x="56" y="156" fill="#8B95A7" font-size="12">fix-relay · execute · blocks the plan · can be undone</text>
    <text x="56" y="174" fill="#AEB6C4" font-size="12">Recommended: Rebase onto main</text>

    <text x="56" y="214" fill="#E6EAF2" font-weight="600">How should the new store be introduced?</text>
    <text x="460" y="214" fill="#8B95A7" font-size="12" text-anchor="end">1 d</text>
    <text x="56" y="234" fill="#8B95A7" font-size="12">storage-v2 · outline · blocks the plan · 3 parts</text>
    <text x="56" y="252" fill="#AEB6C4" font-size="12">Recommended: A file per plan, …</text>
    <rect x="56" y="268" width="404" height="1" fill="#252C38"/>

    <text x="56" y="296" fill="#E6EAF2" font-weight="600">Delete published v1 endpoints?</text>
    <text x="460" y="296" fill="#8B95A7" font-size="12" text-anchor="end">1 d</text>
    <text x="56" y="316" fill="#8B95A7" font-size="12">drop-legacy-api · finalize · blocks the plan · cannot be undone</text>
    <text x="56" y="334" fill="#AEB6C4" font-size="12">Waiver requested</text>
    <rect x="56" y="350" width="404" height="1" fill="#252C38"/>

    <text x="56" y="378" fill="#AEB6C4">Pick the cache size</text>
    <text x="460" y="378" fill="#8B95A7" font-size="12" text-anchor="end">3 d</text>
    <text x="56" y="398" fill="#6B7587" font-size="12">relay-metrics · plan · does not block</text>
  </g>
  <!-- detail -->
  <rect x="496" y="104" width="672" height="590" rx="10" fill="#161B22" stroke="#2A3140"/>
  <text x="520" y="138" fill="#E6EAF2" font-size="19" font-weight="600">Resolve rebase conflict</text>
  <text x="520" y="162" fill="#8B95A7" font-size="12">pm-mcp-clients › Fix Relay Transport · execute · implement · asked 2 h ago</text>
  <text x="520" y="194" fill="#AEB6C4" font-size="13">The change conflicts with main in RelayServer.java.</text>
  <g font-size="12">
    <text x="520" y="224" fill="#6B7587">File</text><text x="600" y="224" fill="#9DB4FF">RelayServer.java · lines 42–58</text>
    <text x="520" y="244" fill="#6B7587">Summary</text><text x="600" y="244" fill="#AEB6C4">both versions of the method</text>
  </g>
  <rect x="520" y="262" width="624" height="40" rx="8" fill="#1E2240" stroke="#3B3F7A"/>
  <text x="536" y="287" fill="#C9C3FF" font-size="13"><tspan font-weight="600">Recommended: Rebase onto main</tspan> · by implement · keeps the history linear</text>
  <g font-size="13">
    <rect x="520" y="314" width="624" height="50" rx="8" fill="none" stroke="#2A3140"/>
    <circle cx="542" cy="339" r="7" fill="none" stroke="#6B7587"/><text x="560" y="336" fill="#E6EAF2">1  Merge main into the branch</text><text x="560" y="354" fill="#8B95A7" font-size="11">1 of 3 votes · preserves commit SHAs</text>
    <rect x="520" y="372" width="624" height="78" rx="8" fill="#1A1F33" stroke="#7C6CF6"/>
    <circle cx="542" cy="397" r="7" fill="#7C6CF6"/><text x="560" y="394" fill="#E6EAF2" font-weight="600">2  Rebase onto main</text><text x="560" y="412" fill="#8B95A7" font-size="11">2 of 3 votes · 2 models · keeps history linear</text>
    <text x="560" y="436" fill="#F6C46B" font-size="12">Against (implement): the branch was pushed; a rebase rewrites what others pulled.</text>
    <rect x="520" y="458" width="624" height="50" rx="8" fill="none" stroke="#2A3140"/>
    <circle cx="542" cy="483" r="7" fill="none" stroke="#6B7587"/><text x="560" y="480" fill="#E6EAF2">3  Stop the plan and ask me later</text><text x="560" y="498" fill="#8B95A7" font-size="11">pauses execution</text>
  </g>
  <text x="520" y="540" fill="#9DB4FF" font-size="13">✎ Answer in my own words · + Add a note</text>
  <rect x="520" y="560" width="624" height="1" fill="#252C38"/>
  <rect x="520" y="580" width="110" height="36" rx="8" fill="#7C6CF6"/><text x="575" y="603" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">Decide ⏎</text>
  <rect x="640" y="580" width="130" height="36" rx="8" fill="none" stroke="#3A4356"/><text x="705" y="603" fill="#E6EAF2" font-size="13" text-anchor="middle">Chat first</text>
  <rect x="780" y="580" width="90" height="36" rx="8" fill="none" stroke="#3A4356"/><text x="825" y="603" fill="#E6EAF2" font-size="13" text-anchor="middle">Later</text>
  <text x="1144" y="603" fill="#AEB6C4" font-size="16" text-anchor="end">⋯</text>
  <text x="520" y="660" fill="#6B7587" font-size="12">Keys: 1–9 choose · ⏎ decide · c chat · l later · j/k next/previous. Wireframe, not to scale.</text>
</svg>
