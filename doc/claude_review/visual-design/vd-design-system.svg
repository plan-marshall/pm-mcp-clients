<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Design system v2 overview</title>
  <desc id="d">Top: surface and state colours for the dark and the light theme. Middle: the type scale from 12 to 36 pixels. Bottom: buttons, status labels with dot and word, a count badge, an id chip, and an attention strip, in the dark theme.</desc>
  <rect width="1200" height="760" fill="#0E1116"/>
  <text x="32" y="40" fill="#E6EAF2" font-size="20" font-weight="600">Design system v2 · calm control room</text>
  <!-- dark palette -->
  <text x="32" y="78" fill="#8B95A7" font-size="12" font-weight="500">Dark</text>
  <g font-size="10" fill="#AEB6C4">
    <rect x="32" y="88" width="64" height="44" rx="8" fill="#0E1116" stroke="#2A3140"/><text x="32" y="148">app</text>
    <rect x="104" y="88" width="64" height="44" rx="8" fill="#161B22" stroke="#2A3140"/><text x="104" y="148">surface</text>
    <rect x="176" y="88" width="64" height="44" rx="8" fill="#1C2230"/><text x="176" y="148">raised</text>
    <rect x="248" y="88" width="64" height="44" rx="8" fill="#7C6CF6"/><text x="248" y="148">brand</text>
    <rect x="320" y="88" width="64" height="44" rx="8" fill="#F2A93B"/><text x="320" y="148">attention</text>
    <rect x="392" y="88" width="64" height="44" rx="8" fill="#4C9AFF"/><text x="392" y="148">running</text>
    <rect x="464" y="88" width="64" height="44" rx="8" fill="#F25F5C"/><text x="464" y="148">danger</text>
    <rect x="536" y="88" width="64" height="44" rx="8" fill="#3FB37F"/><text x="536" y="148">success</text>
  </g>
  <!-- light palette -->
  <text x="640" y="78" fill="#8B95A7" font-size="12" font-weight="500">Light</text>
  <rect x="632" y="84" width="544" height="72" rx="10" fill="#F7F7F5"/>
  <g font-size="10" fill="#3E4450">
    <rect x="640" y="92" width="56" height="36" rx="8" fill="#F7F7F5" stroke="#E3E3DE"/><text x="640" y="146">app</text>
    <rect x="704" y="92" width="56" height="36" rx="8" fill="#FFFFFF" stroke="#E3E3DE"/><text x="704" y="146">surface</text>
    <rect x="768" y="92" width="56" height="36" rx="8" fill="#F0F0EC"/><text x="768" y="146">subtle</text>
    <rect x="832" y="92" width="56" height="36" rx="8" fill="#5B4BDB"/><text x="832" y="146">brand</text>
    <rect x="896" y="92" width="56" height="36" rx="8" fill="#B86E00"/><text x="896" y="146">attention</text>
    <rect x="960" y="92" width="56" height="36" rx="8" fill="#1F5FBF"/><text x="960" y="146">running</text>
    <rect x="1024" y="92" width="56" height="36" rx="8" fill="#C0362F"/><text x="1024" y="146">danger</text>
    <rect x="1088" y="92" width="56" height="36" rx="8" fill="#1E7A4E"/><text x="1088" y="146">success</text>
  </g>
  <!-- type scale -->
  <text x="32" y="196" fill="#8B95A7" font-size="12" font-weight="500">Type scale (Inter, tabular numerals)</text>
  <g fill="#E6EAF2">
    <text x="32" y="246" font-size="36" font-weight="600">36 · 5 waiting</text>
    <text x="360" y="246" font-size="28" font-weight="600">28 · Page title</text>
    <text x="660" y="246" font-size="22" font-weight="600">22 · Panel title</text>
    <text x="32" y="290" font-size="18" font-weight="600">18 · Section title</text>
    <text x="260" y="290" font-size="16" font-weight="500">16 · Row title</text>
    <text x="440" y="290" font-size="14">14 · Body and buttons</text>
    <text x="640" y="290" font-size="13" fill="#AEB6C4">13 · Meta line</text>
    <text x="790" y="290" font-size="12" font-weight="500" fill="#8B95A7">12 · Overline label</text>
  </g>
  <!-- components -->
  <text x="32" y="344" fill="#8B95A7" font-size="12" font-weight="500">Buttons</text>
  <rect x="32" y="356" width="150" height="34" rx="8" fill="#7C6CF6"/><text x="107" y="378" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">Start the plan</text>
  <rect x="192" y="356" width="110" height="34" rx="8" fill="none" stroke="#3A4356"/><text x="247" y="378" fill="#E6EAF2" font-size="14" text-anchor="middle">Pause</text>
  <rect x="312" y="356" width="90" height="34" rx="8" fill="#1E2433"/><text x="357" y="378" fill="#E6EAF2" font-size="14" text-anchor="middle">Chat</text>
  <rect x="412" y="356" width="34" height="34" rx="8" fill="none"/><text x="429" y="379" fill="#AEB6C4" font-size="18" text-anchor="middle">⋯</text>
  <text x="470" y="370" fill="#8B95A7" font-size="12">primary · secondary · ghost · overflow</text>
  <text x="470" y="386" fill="#8B95A7" font-size="12">danger appears only inside a confirm dialog</text>

  <text x="32" y="434" fill="#8B95A7" font-size="12" font-weight="500">Status labels (dot + word)</text>
  <g font-size="14" fill="#AEB6C4">
    <circle cx="40" cy="460" r="4" fill="#F2A93B"/><text x="52" y="465">Waits for you</text>
    <circle cx="180" cy="460" r="4" fill="#4C9AFF"/><text x="192" y="465">Running</text>
    <circle cx="290" cy="460" r="4" fill="#8B95A7"/><text x="302" y="465">Paused</text>
    <circle cx="390" cy="460" r="4" fill="#F25F5C"/><text x="402" y="465">Held</text>
    <circle cx="470" cy="460" r="4" fill="#3FB37F"/><text x="482" y="465">Merged</text>
  </g>

  <text x="640" y="434" fill="#8B95A7" font-size="12" font-weight="500">Count badge · id chip · kind</text>
  <rect x="640" y="448" width="28" height="18" rx="9" fill="#F2A93B"/><text x="654" y="461" fill="#1A1406" font-size="11" font-weight="700" text-anchor="middle">5</text>
  <rect x="680" y="446" width="96" height="22" rx="6" fill="#1E2433"/><text x="728" y="461" fill="#AEB6C4" font-size="11" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">fix-relay</text>
  <text x="792" y="462" fill="#B58CFF" font-size="14">◇</text><text x="808" y="462" fill="#AEB6C4" font-size="14">Epic</text>

  <text x="32" y="512" fill="#8B95A7" font-size="12" font-weight="500">Card with row and attention strip</text>
  <rect x="32" y="524" width="1136" height="200" rx="12" fill="#161B22"/>
  <text x="56" y="560" fill="#E6EAF2" font-size="18" font-weight="600">Relay Hardening</text>
  <text x="56" y="582" fill="#8B95A7" font-size="13">Epic · 3 running · 3 staged · automatic start on</text>
  <rect x="56" y="598" width="1088" height="1" fill="#252C38"/>
  <text x="56" y="630" fill="#E6EAF2" font-size="16" font-weight="500">Fix Relay Transport</text>
  <circle cx="560" cy="625" r="4" fill="#F2A93B"/><text x="572" y="630" fill="#AEB6C4" font-size="14">Waits for you</text>
  <text x="720" y="630" fill="#AEB6C4" font-size="14">Execute</text>
  <text x="840" y="630" fill="#8B95A7" font-size="14">2 h 10 min</text>
  <rect x="960" y="621" width="120" height="6" rx="3" fill="#252C38"/><rect x="960" y="621" width="80" height="6" rx="3" fill="#4C9AFF"/>
  <text x="1136" y="631" fill="#AEB6C4" font-size="18" text-anchor="end">⋯</text>
  <rect x="56" y="652" width="1088" height="44" rx="10" fill="#2A2112"/>
  <circle cx="76" cy="674" r="4" fill="#F2A93B"/>
  <text x="90" y="679" fill="#F6C46B" font-size="14" font-weight="600">Waits for your decision: Resolve rebase conflict</text>
  <text x="1128" y="679" fill="#F6C46B" font-size="14" font-weight="600" text-anchor="end">Open the decision →</text>
  <text x="32" y="748" fill="#6B7587" font-size="11">Proposed values; final values must pass the contrast audit (VD-V-02).</text>
</svg>
