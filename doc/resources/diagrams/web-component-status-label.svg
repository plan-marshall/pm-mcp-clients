<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">StatusLabel</title>
  <desc id="d">Five status labels, each an eight pixel dot in its state colour followed by the state word in the secondary text colour.</desc>
  <rect width="360" height="140" fill="#F7F7F5"/>
  <g font-size="13" fill="#3E4450">
    <circle cx="32" cy="30" r="4" fill="#1F5FBF"/><text x="48" y="35">running</text>
    <circle cx="32" cy="58" r="4" fill="#B86E00"/><text x="48" y="63">waiting for you</text>
    <circle cx="32" cy="86" r="4" fill="#7A808B"/><text x="48" y="91">held</text>
    <circle cx="32" cy="114" r="4" fill="#C0362F"/><text x="48" y="119">failed</text>
    <circle cx="200" cy="58" r="4" fill="#1E7A4E"/><text x="216" y="63">done</text>
  </g>
  <text x="200" y="35" font-size="11" fill="#5F6672">the dot and the word,</text>
  <text x="200" y="49" font-size="11" fill="#5F6672">never the colour alone</text>
</svg>
