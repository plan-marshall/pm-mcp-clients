<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <!-- Theme handling: theme-neutral. The picture paints its own light surface, as every component picture of components.adoc does, so it reads the same on a light and a dark page. -->
  <title id="t">RowMenu</title>
  <desc id="d">The report row menu as the product ships it. Above: the closed trigger "Report actions", and the open menu below its trigger with its one entry "Mark read" focused. Below: a row right above the phone's bottom bar opens its menu upwards, so the bar does not cover it.</desc>
  <rect width="360" height="240" fill="#F7F7F5"/>

  <!-- Closed trigger -->
  <rect x="24" y="16" width="112" height="28" rx="6" fill="#FFFFFF" stroke="#CFCFC8" stroke-width="1"/>
  <g fill="#3E4450">
    <circle cx="36" cy="30" r="1.3"/>
    <circle cx="42" cy="30" r="1.3"/>
    <circle cx="48" cy="30" r="1.3"/>
  </g>
  <text x="56" y="34" font-size="11" fill="#16181D">Report actions</text>
  <text x="24" y="60" font-size="10" fill="#5F6672">closed</text>

  <!-- Open: the trigger and its menu, aligned to the trigger's end -->
  <rect x="224" y="16" width="112" height="28" rx="6" fill="#F0F0EC" stroke="#5B4BDB" stroke-width="1.5"/>
  <g fill="#3E4450">
    <circle cx="236" cy="30" r="1.3"/>
    <circle cx="242" cy="30" r="1.3"/>
    <circle cx="248" cy="30" r="1.3"/>
  </g>
  <text x="256" y="34" font-size="11" fill="#16181D">Report actions</text>
  <rect x="156" y="48" width="180" height="36" rx="6" fill="#FFFFFF" stroke="#CFCFC8" stroke-width="1"/>
  <rect x="160" y="52" width="172" height="28" rx="4" fill="#F0F0EC" stroke="#5B4BDB" stroke-width="1.5"/>
  <text x="170" y="70" font-size="11" fill="#16181D" font-weight="500">Mark read</text>

  <!-- Keyboard and touch advisory -->
  <text x="24" y="78" font-size="10" fill="#5B4BDB">focus ring (3:1)</text>
  <text x="24" y="92" font-size="10" fill="#5F6672">44 px entries on a phone</text>
  <text x="24" y="106" font-size="10" fill="#5F6672">Esc / Tab: focus to trigger</text>

  <rect x="24" y="120" width="312" height="1" fill="#E3E3DE"/>

  <!-- At the bottom of a phone: the menu opens upwards, clear of the bar -->
  <text x="24" y="146" font-size="10" fill="#5F6672">a row above the</text>
  <text x="24" y="160" font-size="10" fill="#5F6672">bottom bar opens</text>
  <text x="24" y="174" font-size="10" fill="#5F6672">its menu upwards</text>
  <rect x="156" y="130" width="180" height="36" rx="6" fill="#FFFFFF" stroke="#CFCFC8" stroke-width="1"/>
  <rect x="160" y="134" width="172" height="28" rx="4" fill="#F0F0EC" stroke="#5B4BDB" stroke-width="1.5"/>
  <text x="170" y="152" font-size="11" fill="#16181D" font-weight="500">Mark read</text>
  <rect x="224" y="170" width="112" height="28" rx="6" fill="#F0F0EC" stroke="#5B4BDB" stroke-width="1.5"/>
  <g fill="#3E4450">
    <circle cx="236" cy="184" r="1.3"/>
    <circle cx="242" cy="184" r="1.3"/>
    <circle cx="248" cy="184" r="1.3"/>
  </g>
  <text x="256" y="188" font-size="11" fill="#16181D">Report actions</text>

  <!-- The phone's sticky bottom bar -->
  <rect x="0" y="206" width="360" height="34" fill="#FFFFFF"/>
  <rect x="0" y="206" width="360" height="1" fill="#CFCFC8"/>
  <g font-size="10" fill="#5F6672" text-anchor="middle">
    <text x="45" y="227">Running work</text>
    <text x="135" y="227">Decisions</text>
    <text x="225" y="227" fill="#5B4BDB" font-weight="600">Reports</text>
    <text x="315" y="227">More</text>
  </g>
</svg>
