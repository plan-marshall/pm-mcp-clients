<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <!-- Theme handling: theme-neutral. The picture paints its own surface, as every component picture of components.adoc does, so it reads the same on a light and a dark page. -->
  <title id="t">RowMenu</title>
  <desc id="d">The row menu of a report row. Above: the closed trigger, an icon-only button with three dots, and the open menu below its trigger with the entry "Mark read" focused and a disabled entry that keeps its reason and is reached by the arrow keys. Below: a row right above the phone's bottom bar opens its menu upwards, so the bar does not cover it.</desc>
  <rect width="360" height="260" fill="#F7F7F5"/>
  <rect x="24" y="16" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#CFCFC8" stroke-width="1"/>
  <circle cx="32" cy="30" r="1.4" fill="#3E4450"/>
  <circle cx="38" cy="30" r="1.4" fill="#3E4450"/>
  <circle cx="44" cy="30" r="1.4" fill="#3E4450"/>
  <text x="24" y="60" font-size="10" fill="#5F6672">closed</text>
  <rect x="308" y="16" width="28" height="28" rx="6" fill="#F0F0EC" stroke="#5B4BDB" stroke-width="1.5"/>
  <circle cx="316" cy="30" r="1.4" fill="#3E4450"/>
  <circle cx="322" cy="30" r="1.4" fill="#3E4450"/>
  <circle cx="328" cy="30" r="1.4" fill="#3E4450"/>
  <rect x="156" y="48" width="180" height="62" rx="6" fill="#FFFFFF" stroke="#CFCFC8"/>
  <rect x="160" y="52" width="172" height="26" rx="4" fill="#F0F0EC" stroke="#5B4BDB" stroke-width="1.5"/>
  <text x="170" y="69" font-size="11" fill="#16181D" font-weight="500">Mark read</text>
  <text x="170" y="98" font-size="11" fill="#5F6672">Archive…</text>
  <text x="248" y="98" font-size="9" fill="#5F6672">disabled, says why</text>
  <text x="24" y="84" font-size="10" fill="#5B4BDB">focus ring (3:1)</text>
  <text x="24" y="98" font-size="10" fill="#5F6672">disabled entries keep</text>
  <text x="24" y="110" font-size="10" fill="#5F6672">their reason; the arrow</text>
  <text x="24" y="122" font-size="10" fill="#5F6672">keys reach them</text>
  <rect x="24" y="130" width="312" height="1" fill="#E3E3DE"/>
  <text x="24" y="160" font-size="10" fill="#5F6672">a row above the</text>
  <text x="24" y="174" font-size="10" fill="#5F6672">bottom bar opens</text>
  <text x="24" y="188" font-size="10" fill="#5F6672">its menu upwards</text>
  <rect x="156" y="138" width="180" height="62" rx="6" fill="#FFFFFF" stroke="#CFCFC8"/>
  <rect x="160" y="142" width="172" height="26" rx="4" fill="#F0F0EC" stroke="#5B4BDB" stroke-width="1.5"/>
  <text x="170" y="159" font-size="11" fill="#16181D" font-weight="500">Mark read</text>
  <text x="170" y="188" font-size="11" fill="#5F6672">Archive…</text>
  <text x="248" y="188" font-size="9" fill="#5F6672">disabled, says why</text>
  <rect x="308" y="204" width="28" height="28" rx="6" fill="#F0F0EC" stroke="#5B4BDB" stroke-width="1.5"/>
  <circle cx="316" cy="218" r="1.4" fill="#3E4450"/>
  <circle cx="322" cy="218" r="1.4" fill="#3E4450"/>
  <circle cx="328" cy="218" r="1.4" fill="#3E4450"/>
  <rect x="0" y="236" width="360" height="24" fill="#FFFFFF"/>
  <rect x="0" y="236" width="360" height="1" fill="#CFCFC8"/>
  <g font-size="10" fill="#5F6672" text-anchor="middle">
    <text x="45" y="252">Running work</text>
    <text x="135" y="252">Decisions</text>
    <text x="225" y="252" fill="#5B4BDB" font-weight="600">Reports</text>
    <text x="315" y="252">More</text>
  </g>
</svg>
