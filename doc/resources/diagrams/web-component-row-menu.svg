<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">RowMenu</title>
  <desc id="d">A row menu trigger with its open popup, visible focus ring on the active item, and keyboard navigation.</desc>
  <rect width="360" height="140" fill="#F7F7F5"/>
  <!-- Closed trigger -->
  <g font-size="12">
    <rect x="24" y="24" width="76" height="28" rx="6" fill="#FFFFFF" stroke="#CFCFC8" stroke-width="1"/>
    <g fill="#3E4450">
      <circle cx="36" cy="38" r="1.3"/>
      <circle cx="42" cy="38" r="1.3"/>
      <circle cx="48" cy="38" r="1.3"/>
    </g>
    <text x="56" y="42" font-size="11" fill="#16181D">Actions</text>
    <text x="24" y="70" font-size="10" fill="#5F6672">closed (trigger)</text>
  </g>
  <!-- Open popup card -->
  <g font-size="12">
    <!-- Trigger in open state -->
    <rect x="140" y="16" width="76" height="28" rx="6" fill="#F0F0EC" stroke="#5B4BDB" stroke-width="1.5"/>
    <g fill="#3E4450">
      <circle cx="152" cy="30" r="1.3"/>
      <circle cx="158" cy="30" r="1.3"/>
      <circle cx="164" cy="30" r="1.3"/>
    </g>
    <text x="172" y="34" font-size="11" fill="#16181D">Actions</text>
    <!-- Menu popup -->
    <rect x="140" y="48" width="140" height="76" rx="6" fill="#FFFFFF" stroke="#CFCFC8" stroke-width="1"/>
    <!-- Item 1 (focused with brand outline) -->
    <rect x="144" y="52" width="132" height="22" rx="4" fill="#F0F0EC" stroke="#5B4BDB" stroke-width="1.5"/>
    <text x="152" y="67" font-size="11" fill="#16181D" font-weight="500">Mark as read</text>
    <!-- Item 2 -->
    <rect x="144" y="76" width="132" height="22" rx="4" fill="none"/>
    <text x="152" y="91" font-size="11" fill="#16181D">Copy link</text>
    <!-- Item 3 (disabled) -->
    <rect x="144" y="100" width="132" height="20" rx="4" fill="none"/>
    <text x="152" y="114" font-size="11" fill="#A0A5B1">Archive</text>
  </g>
  <!-- Keyboard & touch advisory -->
  <text x="290" y="64" font-size="10" fill="#5B4BDB">focus ring (3:1)</text>
  <text x="290" y="80" font-size="10" fill="#5F6672">44 px on phone</text>
  <text x="290" y="96" font-size="10" fill="#5F6672">Esc / Tab return</text>
</svg>
