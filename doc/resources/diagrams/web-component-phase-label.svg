<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <!-- Theme handling: theme-neutral. The picture paints its own surface, as every component picture of components.adoc does, so it reads the same on a light and a dark page. -->
  <title id="t">PhaseLabel</title>
  <desc id="d">Three phase labels without a box: the play icon with "execute", the flag icon with "finalize", and a decision's phase "execute · implement" with the role that asks.</desc>
  <rect width="360" height="140" fill="#F7F7F5"/>
  <path d="M28 42l9 6-9 6z" stroke="#3E4450" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="44" y="53" font-size="12" fill="#3E4450">execute</text>
  <path d="M121 55v-13h9l-2 3 2 3h-9" stroke="#3E4450" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="138" y="53" font-size="12" fill="#3E4450">finalize</text>
  <path d="M216 42l9 6-9 6z" stroke="#3E4450" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="232" y="53" font-size="12" fill="#3E4450">execute · implement</text>
  <text x="24" y="92" font-size="11" fill="#5F6672">the phase icon and the catalogue's word, no box;</text>
  <text x="24" y="108" font-size="11" fill="#5F6672">the same product term in English and German</text>
</svg>
