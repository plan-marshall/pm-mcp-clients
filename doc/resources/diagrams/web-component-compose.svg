<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <!-- Theme handling: theme-neutral. The picture paints its own surface, as every component picture of components.adoc does, so it reads the same on a light and a dark page. -->
  <title id="t">Compose</title>
  <desc id="d">A compose field: a text area holding "Split the auth workstream; drop the docs plan" and, at its end, the send act as an icon with a visually hidden label.</desc>
  <rect width="360" height="140" fill="#F7F7F5"/>
  <text x="24" y="28" font-size="12" fill="#16181D" font-weight="500">Instruction</text>
  <rect x="24" y="36" width="312" height="52" rx="8" fill="#FFFFFF" stroke="#CFCFC8"/>
  <text x="36" y="58" font-size="12" fill="#16181D">Split the auth workstream; drop the</text>
  <text x="36" y="74" font-size="12" fill="#16181D">docs plan</text>
  <rect x="298" y="52" width="28" height="28" rx="8" fill="#FFFFFF" stroke="#CFCFC8"/>
  <path d="M306 66l12-6-4 12-2-5z" stroke="#3E4450" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="112" font-size="11" fill="#5F6672">Enter sends, Shift+Enter adds a line; nothing is sent</text>
  <text x="24" y="126" font-size="11" fill="#5F6672">while an input method or dictation is composing</text>
</svg>
