<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Button, its variants and its sizes</title>
  <desc id="d">One primary, one secondary, one ghost and one danger button, and a primary button in the disabled state at half opacity.</desc>
  <rect width="360" height="140" fill="#F7F7F5"/>
  <g font-size="13">
    <rect x="24" y="30" width="104" height="36" rx="8" fill="#5B4BDB"/>
    <text x="76" y="53" fill="#FFFFFF" text-anchor="middle">Save</text>
    <rect x="140" y="30" width="104" height="36" rx="8" fill="#FFFFFF" stroke="#CFCFC8"/>
    <text x="192" y="53" fill="#16181D" text-anchor="middle">Cancel</text>
    <rect x="256" y="30" width="84" height="36" rx="8" fill="none"/>
    <text x="298" y="53" fill="#3E4450" text-anchor="middle">Details</text>
    <rect x="24" y="82" width="104" height="36" rx="8" fill="#C0362F"/>
    <text x="76" y="105" fill="#FFFFFF" text-anchor="middle">Delete</text>
    <rect x="140" y="82" width="104" height="36" rx="8" fill="#5B4BDB" opacity="0.5"/>
    <text x="192" y="105" fill="#FFFFFF" text-anchor="middle">Save</text>
  </g>
  <text x="256" y="98" font-size="11" fill="#5F6672">disabled</text>
  <text x="256" y="112" font-size="11" fill="#5F6672">with its reason</text>
</svg>
