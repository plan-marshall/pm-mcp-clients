<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <!-- Theme handling: theme-neutral. The picture paints its own surface, as every component picture of components.adoc does, so it reads the same on a light and a dark page. -->
  <title id="t">Toggle</title>
  <desc id="d">Three toggles: a favourite star off, the same star on with the pressed ground, and the eye that reveals a secret.</desc>
  <rect width="360" height="140" fill="#F7F7F5"/>
  <rect x="24" y="44" width="28" height="28" rx="8" fill="none"/>
  <path d="M38 51.5l2 4.2 4.6.6-3.3 3.2.8 4.6-4.1-2.2-4.1 2.2.8-4.6-3.3-3.2 4.6-.6z" stroke="#3E4450" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="68" y="44" width="28" height="28" rx="8" fill="#F0F0EC"/>
  <path d="M82 51.5l2 4.2 4.6.6-3.3 3.2.8 4.6-4.1-2.2-4.1 2.2.8-4.6-3.3-3.2 4.6-.6z" stroke="#3E4450" stroke-width="1.5" fill="#3E4450" stroke-linejoin="round"/>
  <rect x="112" y="44" width="28" height="28" rx="8" fill="#F0F0EC"/>
  <path d="M119 58c2-4 5-6 7-6s5 2 7 6c-2 4-5 6-7 6s-5-2-7-6z" stroke="#3E4450" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="126" cy="58" r="2.2" stroke="#3E4450" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="92" font-size="11" fill="#5F6672">off</text>
  <text x="68" y="92" font-size="11" fill="#5F6672">on</text>
  <text x="112" y="92" font-size="11" fill="#5F6672">reveal</text>
  <text x="160" y="56" font-size="11" fill="#3E4450">aria-pressed; the label names</text>
  <text x="160" y="70" font-size="11" fill="#3E4450">the thing, the icon its state</text>
  <text x="24" y="120" font-size="11" fill="#5F6672">one thing on or off; never colour alone</text>
</svg>
