    <circle cx="38" cy="66" r="1.4" fill="#3E4450" stroke="none"/>
    <circle cx="44" cy="66" r="1.4" fill="#3E4450" stroke="none"/>
    <rect x="72" y="49" width="34" height="34" rx="8"/>
    <path d="M83 66h12M89 60v12"/>
