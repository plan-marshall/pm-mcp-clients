<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 196" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">EmptyState</title>
  <desc id="d">The mascot's bust in the pose all-clear above a title, one sentence and one primary act. The bust is drawn as a placeholder frame; the figure itself is the mascot illustration.</desc>
  <rect width="360" height="196" fill="#F7F7F5"/>
  <rect x="120" y="12" width="120" height="68" rx="10" fill="#EDEBE6" stroke="#B9B6AE" stroke-dasharray="4 3"/>
  <text x="180" y="42" font-size="11" fill="#5F6672" text-anchor="middle">mascot bust</text>
  <text x="180" y="57" font-size="10" fill="#5F6672" text-anchor="middle">all-clear · 120–160 px</text>
  <text x="180" y="116" font-size="15" font-weight="600" fill="#16181D" text-anchor="middle">Nothing waits for you</text>
  <text x="180" y="136" font-size="12" fill="#3E4450" text-anchor="middle">New decisions and reports arrive here.</text>
  <text x="180" y="152" font-size="12" fill="#3E4450" text-anchor="middle">Leave the page open; it updates by itself.</text>
  <rect x="124" y="164" width="112" height="26" rx="8" fill="#5B4BDB"/>
  <text x="180" y="181" font-size="12" fill="#FFFFFF" text-anchor="middle">Open the projects</text>
</svg>
