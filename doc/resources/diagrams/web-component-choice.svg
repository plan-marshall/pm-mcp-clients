<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <!-- Theme handling: theme-neutral. The picture paints its own surface, as every component picture of components.adoc does, so it reads the same on a light and a dark page. -->
  <title id="t">RadioGroup and CheckGroup</title>
  <desc id="d">A radio group with the question "Which way?" as its legend and two option cards: the first chosen, with a brand edge and the recommended marker, the second not. Below it a check group "Items" with one item checked and one not.</desc>
  <rect width="360" height="230" fill="#F7F7F5"/>
  <text x="24" y="26" font-size="12" fill="#16181D" font-weight="500">Which way?</text>
  <rect x="24" y="34" width="312" height="36" rx="8" fill="#FFFFFF" stroke="#5B4BDB" stroke-width="1.5"/>
  <circle cx="42" cy="52" r="6" fill="none" stroke="#5B4BDB" stroke-width="1.5"/><circle cx="42" cy="52" r="3" fill="#5B4BDB"/>
  <text x="56" y="56" font-size="12" fill="#16181D">Keep the old API for one release</text>
  <circle cx="236" cy="52" r="6" stroke="#5F6672" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M233 52l2 2 4-4" stroke="#5F6672" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="248" y="56" font-size="11" fill="#3E4450">recommended</text>
  <rect x="24" y="78" width="312" height="36" rx="8" fill="#FFFFFF" stroke="#CFCFC8"/>
  <circle cx="42" cy="96" r="6" fill="none" stroke="#3E4450" stroke-width="1.5"/>
  <text x="56" y="100" font-size="12" fill="#16181D">Remove it now</text>
  <text x="24" y="142" font-size="12" fill="#16181D" font-weight="500">Items</text>
  <rect x="24" y="152" width="14" height="14" rx="3" fill="#5B4BDB"/><path d="M27 159l3 3 5-6" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <text x="46" y="164" font-size="12" fill="#16181D">Archived plans</text>
  <rect x="24" y="176" width="14" height="14" rx="3" fill="none" stroke="#3E4450" stroke-width="1.5"/>
  <text x="46" y="188" font-size="12" fill="#16181D">Logs of ended work</text>
  <text x="24" y="216" font-size="11" fill="#5F6672">the legend asks; the whole card or label row is the target</text>
</svg>
