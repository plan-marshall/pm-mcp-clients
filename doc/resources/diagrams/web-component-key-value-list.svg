<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">KeyValueList</title>
  <desc id="d">Three figures in two columns: the name in the muted colour, the value in the primary text colour.</desc>
  <rect width="360" height="140" fill="#F7F7F5"/>
  <g font-size="13">
    <text x="24" y="38" fill="#5F6672">Status</text>
    <text x="140" y="38" fill="#16181D">running</text>
    <text x="24" y="70" fill="#5F6672">Duration</text>
    <text x="140" y="70" fill="#16181D">2 min 14 s</text>
    <text x="24" y="102" fill="#5F6672">Tokens</text>
    <text x="140" y="102" fill="#16181D">12,480</text>
  </g>
  <text x="24" y="130" font-size="11" fill="#5F6672">a definition list, not a table: every label is the term of its value</text>
</svg>
