<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <!-- Theme handling: theme-neutral. The picture paints its own surface, as every component picture of components.adoc does, so it reads the same on a light and a dark page. -->
  <title id="t">NumberField, SecretField and CodeField</title>
  <desc id="d">Three fields: a number field "Keep ended work" with the value 30, the unit "days" beside it and a separate "never" choice; a secret field "Token" masked with its reveal toggle; and the pairing code field with "KXQB-MRTN" in a large monospace face.</desc>
  <rect width="360" height="220" fill="#F7F7F5"/>
  <text x="24" y="24" font-size="12" fill="#16181D" font-weight="500">Keep ended work</text>
  <rect x="24" y="32" width="64" height="34" rx="8" fill="#FFFFFF" stroke="#CFCFC8"/>
  <text x="36" y="53" font-size="12" fill="#16181D">30</text>
  <text x="96" y="53" font-size="12" fill="#3E4450">days</text>
  <circle cx="146" cy="49" r="6" fill="none" stroke="#3E4450" stroke-width="1.5"/>
  <text x="158" y="53" font-size="12" fill="#16181D">never</text>
  <text x="24" y="92" font-size="12" fill="#16181D" font-weight="500">Token</text>
  <rect x="24" y="100" width="312" height="34" rx="8" fill="#FFFFFF" stroke="#CFCFC8"/>
  <text x="36" y="122" font-size="14" fill="#16181D" letter-spacing="2">••••••••••••••</text>
  <path d="M311 117c2-4 5-6 7-6s5 2 7 6c-2 4-5 6-7 6s-5-2-7-6z" stroke="#3E4450" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="318" cy="117" r="2.2" stroke="#3E4450" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="160" font-size="12" fill="#16181D" font-weight="500">Pairing code</text>
  <rect x="24" y="168" width="170" height="40" rx="8" fill="#FFFFFF" stroke="#CFCFC8"/>
  <text x="38" y="195" font-size="20" font-family="ui-monospace, Menlo, monospace" fill="#16181D">KXQB-MRTN</text>
  <text x="210" y="186" font-size="10" fill="#5F6672">any case, with or</text>
  <text x="210" y="200" font-size="10" fill="#5F6672">without the dash</text>
</svg>
