<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <!-- Theme handling: theme-neutral. The picture paints its own surface, as every component picture of components.adoc does, so it reads the same on a light and a dark page. -->
  <title id="t">SegmentedControl</title>
  <desc id="d">A segmented control of two options in one outlined group: "by plan" chosen, on the brand-subtle ground, and "by epic" not chosen.</desc>
  <rect width="360" height="140" fill="#F7F7F5"/>
  <rect x="24" y="44" width="160" height="30" rx="8" fill="#FFFFFF" stroke="#CFCFC8"/>
  <rect x="27" y="47" width="77" height="24" rx="6" fill="#EEEBFF"/>
  <text x="65.5" y="63" font-size="12" fill="#16181D" text-anchor="middle" font-weight="500">by plan</text>
  <text x="144" y="63" font-size="12" fill="#3E4450" text-anchor="middle">by epic</text>
  <text x="204" y="56" font-size="11" fill="#3E4450">a radio group:</text>
  <text x="204" y="70" font-size="11" fill="#3E4450">aria-checked</text>
  <text x="24" y="104" font-size="11" fill="#5F6672">the chosen option on brand subtle, never a solid fill;</text>
  <text x="24" y="120" font-size="11" fill="#5F6672">a mode of a view, never a setting</text>
</svg>
