<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <!-- Theme handling: theme-neutral. The picture paints its own surface, as every component picture of components.adoc does, so it reads the same on a light and a dark page. -->
  <title id="t">ReasonBadge</title>
  <desc id="d">Three reason badges, each a pill that starts with an exclamation mark: "! decision" and "! 2 · decision" in the attention colours, and "! landing failed" in the danger colours.</desc>
  <rect width="360" height="140" fill="#F7F7F5"/>
  <rect x="24" y="40" width="80" height="22" rx="11.0" fill="#FFF4E0"/>
  <text x="64.0" y="55" font-size="12" fill="#8A5200" text-anchor="middle">! decision</text>
  <rect x="114" y="40" width="104" height="22" rx="11.0" fill="#FFF4E0"/>
  <text x="166.0" y="55" font-size="12" fill="#8A5200" text-anchor="middle">! 2 · decision</text>
  <rect x="228" y="40" width="112" height="22" rx="11.0" fill="#FDECEA"/>
  <text x="284.0" y="55" font-size="12" fill="#C0362F" text-anchor="middle">! landing failed</text>
  <text x="24" y="92" font-size="11" fill="#5F6672">a box means: needs you; the reason of the first, with the count</text>
  <text x="24" y="108" font-size="11" fill="#5F6672">amber for every reason; red for landing failed and integrity hold</text>
</svg>
