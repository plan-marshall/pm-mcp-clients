# The texts of the local API's error codes, one title, cause and fix per code (PLAN-86).
# Plain words: the title says what happened, the cause why, the fix an act the reader can do.
# Every member of de.planmarshall.api.resource.ApiErrorCode has its three keys here and in error.de.properties.

# 400: the request does not fit the endpoint's schema.

error.invalid_arguments.title=The request was not accepted
error.invalid_arguments.cause=A value or a field of the request does not fit what this act accepts.
error.invalid_arguments.fix=Check the values you entered and start the act again.

error.invalid_answer.title=The answer was not accepted
error.invalid_answer.cause=The choice or the wording is not one this question allows.
error.invalid_answer.fix=Choose one of the offered options and send the answer again.

error.dependency_unanswered.title=An earlier question is still open
error.dependency_unanswered.cause=This part can only be answered once the part it depends on is answered.
error.dependency_unanswered.fix=Answer the earlier question first, then come back to this one.

error.pairing_invalid.title=The pairing code did not work
error.pairing_invalid.cause=The code is wrong, has expired, or was already used.
error.pairing_invalid.fix=Get a fresh code in a terminal on this machine and enter it again.

error.unit_name_invalid.title=This name is not allowed
error.unit_name_invalid.cause=A unit's name has to follow the naming rules.
error.unit_name_invalid.fix=Choose another name and save again.

# 403: the listener a request arrived on does not serve the endpoint.

error.cli_only.title=This act runs only in the terminal
error.cli_only.cause=The endpoint is reserved for the command line.
error.cli_only.fix=Use the terminal client for this act.

error.loopback_only.title=This act runs only on this machine
error.loopback_only.cause=The endpoint is served on the local connection only, never over the network.
error.loopback_only.fix=Open the Web-App on this machine or use the terminal.

# 404: the named scope or target does not exist.

error.project_not_enrolled.title=The project is not enrolled
error.project_not_enrolled.cause=No enrolled project matches the name or path given.
error.project_not_enrolled.fix=Enrol the project first and repeat the act.

error.scope_not_found.title=This entry does not exist
error.scope_not_found.cause=No plan, epic, decision, report or entry carries this id.
error.scope_not_found.fix=Check the id or pick the entry from the list again.

error.target_not_found.title=This target does not exist
error.target_not_found.cause=The named device, credential or other item is unknown.
error.target_not_found.fix=Check the entry and pick it from the list again.

# 409: the act conflicts with the addressed state.

error.act_not_available.title=This act is not possible now
error.act_not_available.cause=The current state does not offer it.
error.act_not_available.fix=Reload the view and choose an act the state offers.

error.conflict.title=Something changed in the meantime
error.conflict.cause=The act was made against an older version of the record.
error.conflict.fix=Reload and repeat the act on the current version.

error.already_answered.title=This decision is already answered
error.already_answered.cause=It was answered in the other client first.
error.already_answered.fix=Reload the view to see the answer that was given.

error.onboarding_incomplete.title=A setup step is still missing
error.onboarding_incomplete.cause=The act needs a step of the machine's setup that is not done yet.
error.onboarding_incomplete.fix=Finish the missing setup step in the terminal and repeat the act.

error.aspect_owned.title=A setup step owns this setting
error.aspect_owned.cause=The onboarding or the setup sets this value in its own step.
error.aspect_owned.fix=Open the setup step the detail names and change the value there.

error.lifecycle_closed.title=Plans are not offered here
error.lifecycle_closed.cause=This project does not run the plan lifecycle.
error.lifecycle_closed.fix=Start the work in a project that offers the plan lifecycle.

error.scope_active.title=Work is still running
error.scope_active.cause=The project has running work, so this act is refused.
error.scope_active.fix=Wait until the running work has ended and repeat the act.

error.release_landing_pending.title=The landing is not finished
error.release_landing_pending.cause=A short landing of the project has not finished within its bound.
error.release_landing_pending.fix=Wait a moment and start the release again.

error.axis_bound.title=This setting is fixed for the plan
error.axis_bound.cause=A behaviour axis is bound when the plan starts and cannot change afterwards.
error.axis_bound.fix=Start a new plan if you need other behaviour.

error.team_owned.title=The team owns this value
error.team_owned.cause=The project's team sets this value, not the clients.
error.team_owned.fix=Ask the team to change the value and repeat the act.

error.plan_ended.title=The plan has ended
error.plan_ended.cause=An ended plan accepts no further acts.
error.plan_ended.fix=Open a running plan or start a new one.

error.already_consumed.title=This waiver was already used
error.already_consumed.cause=The item it carried was consumed earlier.
error.already_consumed.fix=Request a new waiver for the item.

error.not_waivable.title=This gate cannot be waived
error.not_waivable.cause=The waiver is not allowed for this gate.
error.not_waivable.fix=Meet the gate's condition instead of waiving it.

error.raise_out_of_range.title=The raise is above the allowed cap
error.raise_out_of_range.cause=The requested budget ceiling is higher than the cap the runtime allows.
error.raise_out_of_range.fix=Enter a smaller raise and try again.

error.position_not_contained.title=This position is outside the document
error.position_not_contained.cause=The addressed document does not contain the named position.
error.position_not_contained.fix=Choose a position inside the document and repeat the act.

error.enrolment_root_conflict.title=This root is already enrolled
error.enrolment_root_conflict.cause=Another enrolment already uses the root given.
error.enrolment_root_conflict.fix=Unenrol the other project first or choose another root.

error.project_store_root_mismatch.title=The store does not belong to the project
error.project_store_root_mismatch.cause=The project's store root does not match its enrolment.
error.project_store_root_mismatch.fix=Check the store root in the enrolment and correct it.

error.enrolment_tampered.title=The enrolment file was changed
error.enrolment_tampered.cause=The project's enrolment file fails its integrity check.
error.enrolment_tampered.fix=Enrol the project again.

error.enrolment_insecure.title=The enrolment file is not private
error.enrolment_insecure.cause=Other users on this machine can read the project's enrolment file.
error.enrolment_insecure.fix=Restrict the file's permissions and repeat the act.

error.enrolment_invalid.title=The enrolment file is invalid
error.enrolment_invalid.cause=Its content does not match the enrolment format.
error.enrolment_invalid.fix=Enrol the project again.

error.harness_version_unsupported.title=The harness version is not supported
error.harness_version_unsupported.cause=The version is outside the range the profile supports.
error.harness_version_unsupported.fix=Update the harness or enrol a supported version.

error.web_listener_conflict.title=The port is already in use
error.web_listener_conflict.cause=Another program holds the port the web listener wants.
error.web_listener_conflict.fix=Choose another port or close the program that holds it.

error.not_withdrawable.title=The stop can no longer be withdrawn
error.not_withdrawable.cause=The stop or the upgrade has gone too far to be withdrawn.
error.not_withdrawable.fix=Let the stop finish and start the runtime again.

error.upgrade_not_possible.title=This installation cannot be upgraded
error.upgrade_not_possible.cause=The runtime does not upgrade an installation of this kind.
error.upgrade_not_possible.fix=Upgrade the installation the way it was installed.

error.credential_store_unavailable.title=The credential store cannot be reached
error.credential_store_unavailable.cause=The recorded store is not available on this machine.
error.credential_store_unavailable.fix=Choose another store in the settings and enter the credential again.

error.unit_not_designable.title=The unit cannot be designed here
error.unit_not_designable.cause=The addressed level does not offer this unit.
error.unit_not_designable.fix=Choose the level the unit belongs to and try again.

error.unit_invalid.title=The unit has errors
error.unit_invalid.cause=Its validation found findings that have to be fixed.
error.unit_invalid.fix=Open the findings, fix them and validate the unit again.

error.no_project_to_compose.title=There is no project to design for
error.no_project_to_compose.cause=A design request needs a project, and none is addressed.
error.no_project_to_compose.fix=Choose a project first and start the design again.

# 423, 500, 503: the store or the runtime is not in a state to serve the request.

error.credential_store_locked.title=The keyring is locked
error.credential_store_locked.cause=The chosen credential store is locked, and nothing was changed.
error.credential_store_locked.fix=Unlock the keyring and repeat the act.

error.internal_fault.title=The runtime hit an unexpected fault
error.internal_fault.cause=The fault could not be attributed to the request; an audit id is recorded.
error.internal_fault.fix=Start the act again; if it fails again, look the audit id up in the log.

error.credential_store_failed.title=The credential store failed
error.credential_store_failed.cause=A read, a write or a delete of the store did not succeed; the entry stays as it was.
error.credential_store_failed.fix=Repeat the act; if it fails again, choose another store.

error.runtime_recovering.title=The runtime is still recovering
error.runtime_recovering.cause=The project's recovery has not finished within its wait, and nothing of the call ran.
error.runtime_recovering.fix=Repeat the call in a moment.

# A code the client does not know: the fallback of every unknown wire value.

error.unknown.title=The runtime refused the request
error.unknown.cause=The refusal carries a code this client does not know.
error.unknown.fix=Update the client and try again; if the refusal stays, look at the details.
