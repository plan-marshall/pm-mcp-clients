# Die Texte der Fehlercodes der lokalen API: je Code ein Titel, eine Ursache und eine Behebung (PLAN-86).
# Schlichte Worte: der Titel sagt, was geschehen ist, die Ursache warum, die Behebung eine Handlung,
# die die lesende Person ausführen kann. Die Anrede ist durchgehend „du".
# Jedes Element von de.planmarshall.api.resource.ApiErrorCode hat seine drei Schlüssel hier und in error.en.properties.

# 400: die Anfrage passt nicht zum Schema des Endpunkts.

error.invalid_arguments.title=Die Anfrage wurde nicht angenommen
error.invalid_arguments.cause=Ein Wert oder ein Feld der Anfrage passt nicht zu dem, was diese Aktion annimmt.
error.invalid_arguments.fix=Prüfe die eingegebenen Werte und starte die Aktion erneut.

error.invalid_answer.title=Die Antwort wurde nicht angenommen
error.invalid_answer.cause=Die Auswahl oder die Formulierung ist bei dieser Frage nicht vorgesehen.
error.invalid_answer.fix=Wähle eine der angebotenen Möglichkeiten und sende die Antwort erneut.

error.dependency_unanswered.title=Eine frühere Frage ist noch offen
error.dependency_unanswered.cause=Dieser Teil lässt sich erst beantworten, wenn der Teil davor beantwortet ist.
error.dependency_unanswered.fix=Beantworte zuerst die frühere Frage und komme dann hierher zurück.

error.pairing_invalid.title=Der Kopplungscode hat nicht funktioniert
error.pairing_invalid.cause=Der Code ist falsch, abgelaufen oder schon verwendet.
error.pairing_invalid.fix=Hol dir einen frischen Code in einem Terminal dieser Maschine und gib ihn erneut ein.

error.unit_name_invalid.title=Dieser Name ist nicht zulässig
error.unit_name_invalid.cause=Der Name einer Einheit muss den Namensregeln folgen.
error.unit_name_invalid.fix=Wähle einen anderen Namen und speichere erneut.

# 403: der Listener, auf dem eine Anfrage ankam, bedient den Endpunkt nicht.

error.cli_only.title=Diese Aktion gibt es nur im Terminal
error.cli_only.cause=Diese Aktion ist der Kommandozeile vorbehalten.
error.cli_only.fix=Nutze für diese Aktion den Terminal-Client.

error.loopback_only.title=Diese Aktion gibt es nur auf dieser Maschine
error.loopback_only.cause=Diese Aktion wird nur über die lokale Verbindung bereitgestellt, nie über das Netzwerk.
error.loopback_only.fix=Öffne die Web-App auf dieser Maschine oder nutze das Terminal.

# 404: der genannte Bereich oder das Ziel gibt es nicht.

error.project_not_enrolled.title=Das Projekt ist nicht eingetragen
error.project_not_enrolled.cause=Zu dem angegebenen Namen oder Pfad gehört kein eingetragenes Projekt.
error.project_not_enrolled.fix=Trage das Projekt zuerst ein und wiederhole die Aktion.

error.scope_not_found.title=Diesen Eintrag gibt es nicht
error.scope_not_found.cause=Kein Plan, kein Epic, keine Entscheidung, kein Report und kein Eintrag trägt diese Kennung.
error.scope_not_found.fix=Prüfe die Kennung oder wähle den Eintrag erneut aus der Liste.

error.target_not_found.title=Dieses Ziel gibt es nicht
error.target_not_found.cause=Das genannte Gerät, die Zugangsdaten oder ein anderer Eintrag ist unbekannt.
error.target_not_found.fix=Prüfe den Eintrag und wähle ihn erneut aus der Liste.

# 409: die Aktion steht im Widerspruch zum angesprochenen Zustand.

error.act_not_available.title=Diese Aktion ist gerade nicht möglich
error.act_not_available.cause=Der aktuelle Zustand bietet sie nicht an.
error.act_not_available.fix=Lade die Ansicht neu und wähle eine Aktion, die der Zustand anbietet.

error.conflict.title=Etwas hat sich inzwischen geändert
error.conflict.cause=Die Aktion richtete sich an eine ältere Fassung des Eintrags.
error.conflict.fix=Lade neu und wiederhole die Aktion auf der aktuellen Fassung.

error.already_answered.title=Diese Entscheidung ist schon beantwortet
error.already_answered.cause=Die Antwort wurde zuerst im anderen Client gegeben.
error.already_answered.fix=Lade die Ansicht neu, um die gegebene Antwort zu sehen.

error.onboarding_incomplete.title=Ein Setup-Schritt fehlt noch
error.onboarding_incomplete.cause=Die Aktion braucht einen Schritt des Maschinen-Setups, der noch nicht erledigt ist.
error.onboarding_incomplete.fix=Erledige den fehlenden Setup-Schritt im Terminal und wiederhole die Aktion.

error.aspect_owned.title=Ein Setup-Schritt besitzt diese Einstellung
error.aspect_owned.cause=Das Onboarding oder das Setup setzt diesen Wert in seinem eigenen Schritt.
error.aspect_owned.fix=Öffne den im Detail genannten Setup-Schritt und ändere den Wert dort.

error.lifecycle_closed.title=Pläne gibt es hier nicht
error.lifecycle_closed.cause=Dieses Projekt führt den Plan-Lebenszyklus nicht.
error.lifecycle_closed.fix=Beginne die Arbeit in einem Projekt, das den Plan-Lebenszyklus anbietet.

error.scope_active.title=Es läuft noch Arbeit
error.scope_active.cause=Das Projekt führt laufende Arbeit aus, deshalb wird die Aktion verweigert.
error.scope_active.fix=Warte, bis die laufende Arbeit beendet ist, und wiederhole die Aktion.

error.release_landing_pending.title=Die Landung ist noch nicht abgeschlossen
error.release_landing_pending.cause=Ein kurzes Landen des Projekts hat seine Frist überschritten.
error.release_landing_pending.fix=Warte einen Moment und starte die Freigabe erneut.

error.axis_bound.title=Diese Einstellung ist für den Plan fest
error.axis_bound.cause=Eine Verhaltensachse wird beim Start des Plans festgelegt und lässt sich danach nicht ändern.
error.axis_bound.fix=Starte einen neuen Plan, wenn du anderes Verhalten brauchst.

error.team_owned.title=Der Wert gehört dem Team
error.team_owned.cause=Den Wert setzt das Team des Projekts, nicht die Clients.
error.team_owned.fix=Bitte das Team, den Wert zu ändern, und wiederhole die Aktion.

error.plan_ended.title=Der Plan ist beendet
error.plan_ended.cause=Ein beendeter Plan nimmt keine weiteren Aktionen an.
error.plan_ended.fix=Öffne einen laufenden Plan oder starte einen neuen.

error.already_consumed.title=Dieser Waiver wurde schon verbraucht
error.already_consumed.cause=Der Eintrag, den er trug, wurde früher verbraucht.
error.already_consumed.fix=Beantrage einen neuen Waiver für den Eintrag.

error.not_waivable.title=Für dieses Gate gibt es keinen Waiver
error.not_waivable.cause=Der Waiver ist für dieses Gate nicht zulässig.
error.not_waivable.fix=Erfülle stattdessen die Bedingung des Gates.

error.raise_out_of_range.title=Die Erhöhung liegt über der Grenze
error.raise_out_of_range.cause=Die gewünschte Obergrenze liegt über der fest eingebauten Grenze der Runtime.
error.raise_out_of_range.fix=Gib eine kleinere Erhöhung an und versuche es erneut.

error.position_not_contained.title=Diese Position liegt außerhalb des Dokuments
error.position_not_contained.cause=Das angesprochene Dokument enthält die genannte Position nicht.
error.position_not_contained.fix=Wähle eine Position im Dokument und wiederhole die Aktion.

error.enrolment_root_conflict.title=Diese Wurzel ist schon eingetragen
error.enrolment_root_conflict.cause=Eine andere Eintragung nutzt die angegebene Wurzel bereits.
error.enrolment_root_conflict.fix=Trage das andere Projekt zuerst aus oder wähle eine andere Wurzel.

error.project_store_root_mismatch.title=Der Store gehört nicht zum Projekt
error.project_store_root_mismatch.cause=Die Store-Wurzel des Projekts passt nicht zu seiner Eintragung.
error.project_store_root_mismatch.fix=Prüfe die Store-Wurzel in der Eintragung und korrigiere sie.

error.enrolment_tampered.title=Die Eintragungsdatei wurde verändert
error.enrolment_tampered.cause=Die Eintragungsdatei des Projekts besteht ihre Prüfung nicht.
error.enrolment_tampered.fix=Trage das Projekt erneut ein.

error.enrolment_insecure.title=Die Eintragungsdatei ist nicht privat
error.enrolment_insecure.cause=Andere Benutzer dieser Maschine können die Eintragungsdatei des Projekts lesen.
error.enrolment_insecure.fix=Schränke die Rechte der Datei ein und wiederhole die Aktion.

error.enrolment_invalid.title=Die Eintragungsdatei ist ungültig
error.enrolment_invalid.cause=Ihr Inhalt entspricht nicht dem Format der Eintragung.
error.enrolment_invalid.fix=Trage das Projekt erneut ein.

error.harness_version_unsupported.title=Diese Harness-Version wird nicht unterstützt
error.harness_version_unsupported.cause=Die Version liegt außerhalb des Bereichs, den das Profil unterstützt.
error.harness_version_unsupported.fix=Aktualisiere den Harness oder trage eine unterstützte Version ein.

error.web_listener_conflict.title=Der Port ist schon belegt
error.web_listener_conflict.cause=Ein anderes Programm hält den Port, den der Web-Listener will.
error.web_listener_conflict.fix=Wähle einen anderen Port oder beende das Programm, das ihn hält.

error.not_withdrawable.title=Der Stopp lässt sich nicht mehr zurücknehmen
error.not_withdrawable.cause=Der Stopp oder das Upgrade ist zu weit gegangen, um zurückgenommen zu werden.
error.not_withdrawable.fix=Lass den Stopp zu Ende laufen und starte die Runtime erneut.

error.upgrade_not_possible.title=Diese Installation lässt sich nicht aktualisieren
error.upgrade_not_possible.cause=Die Runtime aktualisiert keine Installation dieser Art.
error.upgrade_not_possible.fix=Aktualisiere die Installation so, wie sie installiert wurde.

error.credential_store_unavailable.title=Der Zugangsdaten-Speicher ist nicht erreichbar
error.credential_store_unavailable.cause=Der eingetragene Speicher ist auf dieser Maschine nicht verfügbar.
error.credential_store_unavailable.fix=Wähle in den Einstellungen einen anderen Speicher und gib die Zugangsdaten erneut ein.

error.unit_not_designable.title=Diese Einheit lässt sich hier nicht entwerfen
error.unit_not_designable.cause=Die angesprochene Ebene bietet diese Einheit nicht an.
error.unit_not_designable.fix=Wähle die Ebene, zu der die Einheit gehört, und versuche es erneut.

error.unit_invalid.title=Die Einheit hat Fehler
error.unit_invalid.cause=Die Prüfung hat Findings gefunden, die behoben werden müssen.
error.unit_invalid.fix=Öffne die Findings, behebe sie und prüfe die Einheit erneut.

error.no_project_to_compose.title=Es gibt kein Projekt zum Entwerfen
error.no_project_to_compose.cause=Ein Entwurf braucht ein Projekt, und keines ist angesprochen.
error.no_project_to_compose.fix=Wähle zuerst ein Projekt und starte den Entwurf erneut.

# 423, 500, 503: der Speicher oder die Runtime ist nicht in einem Zustand, die Anfrage zu bedienen.

error.credential_store_locked.title=Der Schlüsselbund ist gesperrt
error.credential_store_locked.cause=Der gewählte Zugangsdaten-Speicher ist gesperrt; es wurde nichts geändert.
error.credential_store_locked.fix=Entsperre den Schlüsselbund und wiederhole die Aktion.

error.internal_fault.title=Die Runtime ist auf einen unerwarteten Fehler gestoßen
error.internal_fault.cause=Der Fehler ließ sich nicht auf die Anfrage zurückführen; eine Audit-Kennung ist aufgezeichnet.
error.internal_fault.fix=Starte die Aktion erneut; wenn sie wieder scheitert, such die Audit-Kennung im Log.

error.credential_store_failed.title=Der Zugangsdaten-Speicher ist fehlgeschlagen
error.credential_store_failed.cause=Ein Lesen, Schreiben oder Löschen im Speicher ist nicht gelungen; der Eintrag bleibt, wie er war.
error.credential_store_failed.fix=Wiederhole die Aktion; wenn sie wieder scheitert, wähle einen anderen Speicher.

error.runtime_recovering.title=Die Runtime erholt sich noch
error.runtime_recovering.cause=Die Erholung des Projekts ist innerhalb ihrer Wartezeit nicht fertig geworden, und nichts des Aufrufs lief.
error.runtime_recovering.fix=Wiederhole den Aufruf gleich noch einmal.

# Ein Code, den der Client nicht kennt: der Rückfall für jeden unbekannten Wire-Wert.

error.unknown.title=Die Runtime hat die Anfrage abgelehnt
error.unknown.cause=Die Ablehnung trägt einen Code, den dieser Client nicht kennt.
error.unknown.fix=Aktualisiere den Client und versuche es erneut; bleibt die Ablehnung, sieh dir die Details an.
